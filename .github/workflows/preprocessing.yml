name: Preprocessing Diabetes Dataset

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  preprocessing:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas scikit-learn numpy

      - name: Jalankan preprocessing
        run: |
          python preprocessing/automate_Haikal.S.py

      - name: Commit dan push hasil preprocessing
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add preprocessing/diabetes_train.csv
          git add preprocessing/diabetes_test.csv
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan, skip commit"
          else
            git commit -m "Auto preprocessing - ${{ github.run_number }}"
            git push
          fi